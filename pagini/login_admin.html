<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginAdmin - CyberLab</title>
    <link rel="stylesheet" href="../style/style_loginadmin.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <main class="login-container">
        <h2>Login Admin</h2>
        <form id="loginForm" autocomplete="off">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p id="error-msg" style="color: red;"></p>
        </form>
        <form id="keywordForm" style="display:none;" autocomplete="off">
            <input type="text" id="keyword" placeholder="Cheia catre usa secreta" required>
            <button type="submit">Verifica</button>
            <p id="keyword-msg" style="color: red;"></p>
        </form>
    </main>
    <script>
        async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const ADMIN_HASH = "cb17ea107f60560c2cabe239b224bc901b5b52f916d140cad811a3083846810c";
        let attempts = 0;
        const MAX_ATTEMPTS = 3;
        const LOCK_TIME = 5000;

        let cuvinteCheie = [];
        
        fetch('../json/keywords.json')
            .then(response => response.json())
            .then(data => { cuvinteCheie = data; });
            
        document.getElementById('loginForm').addEventListener('submit', async function(e){
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = "";
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (attempts >= MAX_ATTEMPTS) {
                errorMsg.textContent = "Bai hekare, vrei sa ma furi ? Lasa ca vedem noi!";
                setTimeout(() => {attempts = 0; errorMsg.textContent = ""; }, LOCK_TIME)
                return;
            }

            if(username === "admin"){
                const hash = await sha256(password);
                if(hash === ADMIN_HASH) {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('keywordForm').style.display = 'block';
                    return;
                }
            }
            attempts++;
            errorMsg.textContent = "Username sau parola incorecta!";
        });

        document.getElementById('keywordForm').addEventListener('submit', async function(e){
            e.preventDefault();
            const keywordMsg = document.getElementById('keyword-msg');
            keywordMsg.textContent = "";
            const keyword = document.getElementById('keyword').value.trim();

            const keywordHash = await sha256(keyword);

            if(cuvinteCheie.includes(keywordHash)) {
                localStorage.setItem('user', 'admin');
                window.location.href = "../index.html";
                return;
            } else {
                keywordMsg.textContent = "Cheia este incorecta!";
            }
        });
    </script>
</body>
</html>
